# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-grinn-astra-netboot"
BBFILE_PATTERN_meta-grinn-astra-netboot = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-grinn-astra-netboot = "11"

LAYERDEPENDS_meta-grinn-astra-netboot = "core"
LAYERSERIES_COMPAT_meta-grinn-astra-netboot= "scarthgap"
